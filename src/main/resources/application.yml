spring:
  application:
    name: gamergram

  datasource:
    url: jdbc:postgresql://localhost:5433/gamergram
    username: ${DB_USERNAME:gamergram}
    password: ${DB_PASSWORD:gamergram}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  tomcat:
    # Otherwise Tomcat drops the connection on oversized files and the client never sees 413.
    max-swallow-size: -1

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-dev-only-secret-key-not-for-production-use-change-me}
  expiration-ms: 86400000 # 24 hours
