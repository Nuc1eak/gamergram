services:
  postgres:
    image: postgres:16-alpine
    container_name: gamergram-postgres
    restart: unless-stopped
    environment:
      # Matches the application.yml defaults.
      POSTGRES_DB: gamergram
      POSTGRES_USER: gamergram
      POSTGRES_PASSWORD: gamergram
    ports:
      # Host port 5433 avoids clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - gamergram-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamergram -d gamergram"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamergram-postgres-data:
